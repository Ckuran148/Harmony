<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy's Crew Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== HALF-SCREEN OPTIMIZATIONS ===== */

        body {
            gap: 8px;
            padding: 10px;
            /* Alert, Daypart, Content (flex), Sensors (compact) */
            grid-template-rows: 10% 7% 1fr 17%;
        }

        #site-indicator {
            font-size: 1rem;
            padding: 3px 10px;
            top: 10px;
            right: 10px;
        }

        #last-refresh {
            position: absolute;
            top: 38px;
            right: 10px;
            font-size: 0.75rem;
            color: #ccc;
            z-index: 1000;
        }

        #alert-section   { font-size: 2rem; }
        #daypart-section { font-size: 1.4rem; }

        /* Cards */
        .content-row { gap: 10px; }

        .card { padding: 10px 12px; }

        h2 {
            font-size: 1.3rem;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        li {
            font-size: 1.1rem;
            margin-bottom: 8px;
            padding-bottom: 6px;
            line-height: 1.3;
        }

        /* LTO items – compact for half-screen */
        .lto-item { margin-bottom: 6px; padding-bottom: 6px; }
        .lto-icon { font-size: 1.8rem; }
        .lto-img { width: 30px; height: 30px; }
        .lto-icon-wrap { margin-right: 6px; }
        .lto-text { font-size: 0.85rem; }
        .lto-countdown { font-size: 0.65rem; margin-top: 2px; }

        .jolt-section      { padding: 8px 12px; }
        .jolt-header-small { font-size: 1rem; margin-bottom: 5px; padding-bottom: 4px; }

        /* Sensor row – auto-scroll horizontally when more than 7 cards */
        #sensor-row-container {
            padding: 4px;
            overflow: hidden;
        }
        #sensor-grid {
            gap: 4px;
            height: 100%;
            align-items: stretch;
            flex-wrap: nowrap;
        }
        .sensor-card          { padding: 4px 6px; flex: 1 0 calc((100% - 24px) / 7); }

        /* Auto margins absorb all free space above and below, centering the reading
           between the sensor name and signal row without disturbing space-between */
        .reading {
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Override the always-on media query so fonts stay readable on narrow cards */
        @media (min-width: 100px) {
            .sensor-card h3 {
                /* Full wrapping — show the entire sensor name */
                white-space: normal;
                word-break: break-word;
                overflow: hidden;
                display: block;
                line-height: 1.15;
                font-size: clamp(1.1rem, 11cqw, 1.8rem);
            }
            .reading    { font-size: clamp(1.8rem, 18cqw, 3.2rem); }
            .signal-row { font-size: clamp(0.9rem, 9cqw, 1.3rem); }
        }
    </style>
</head>
<body>

    <div id="site-indicator">Store: Loading...</div>
    <div id="last-refresh">Last refresh: --:--</div>

    <div id="closed-overlay" style="display: none;">
        <div>
            <h1>STORE CLOSED</h1>
            <p id="closed-reason">See you tomorrow!</p>
        </div>
    </div>

    <div id="standby-overlay" style="display: none;">
        <div>
            <h1>STANDBY</h1>
            <p id="standby-wake-time">Waking at --:--</p>
        </div>
    </div>

    <div id="alert-section">Loading System...</div>

    <div id="daypart-section">Calculating Daypart...</div>

    <div class="content-row">
        <div class="card">
            <h2>📢 Announcements</h2>
            <div class="list-container"><ul id="announcements-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card" style="border-top-color: #e00000;"> 
            <h2>🍔 Upcoming LTOs</h2>
            <div class="list-container"><ul id="lto-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card" style="border-top-color: #e6a800;"> 
            <h2>📅 This Week</h2>
            <div class="list-container"><ul id="events-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card jolt-split-card"> 
            <div class="jolt-section jolt-top">
                <div class="jolt-header-small" style="color: #ff9999;">📋 Current & Late</div>
                <div class="list-container" id="jolt-scroll-current"><ul id="jolt-list-current"><li>Syncing...</li></ul></div>
            </div>
            <div class="jolt-section jolt-bottom">
                <div class="jolt-header-small" style="color: #88ccff;">🕒 Upcoming (3 Hrs)</div>
                <div class="list-container" id="jolt-scroll-upcoming"><ul id="jolt-list-upcoming"><li>Loading...</li></ul></div>
            </div>
        </div>
    </div>

    <div id="sensor-row-container">
        <div id="sensor-grid">
            </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>

    <script>
    // Horizontal auto-scroll for sensor grid when > 7 cards
    let sensorScrollInterval = null;
    let sensorScrollSetupPending = null;
    let observerPaused = false;

    function setupSensorScroll() {
        const container = document.getElementById('sensor-row-container');
        const grid = document.getElementById('sensor-grid');
        if (!grid || !container) return;

        // Stop any running scroll
        if (sensorScrollInterval) { clearInterval(sensorScrollInterval); sensorScrollInterval = null; }

        // Pause observer so our own DOM changes don't re-trigger it
        observerPaused = true;

        // Remove any previously cloned cards
        grid.querySelectorAll('.sensor-card-clone').forEach(c => c.remove());

        // Only count original (non-clone) cards
        const cards = Array.from(grid.querySelectorAll('.sensor-card:not(.sensor-card-clone)'));
        if (cards.length <= 7) {
            cards.forEach(c => { c.style.minWidth = ''; c.style.maxWidth = ''; c.style.flexShrink = ''; });
            grid.style.width = '';
            container.scrollLeft = 0;
            observerPaused = false;
            return;
        }

        // Size each card so exactly 7 fit in the visible area
        const gap = 4;
        const cardWidth = (container.clientWidth - gap * 6) / 7;
        cards.forEach(c => {
            c.style.minWidth = cardWidth + 'px';
            c.style.maxWidth = cardWidth + 'px';
            c.style.flexShrink = '0';
        });

        // Clone each card and append to the same grid for seamless wrap
        cards.forEach(c => {
            const clone = c.cloneNode(true);
            clone.classList.add('sensor-card-clone');
            clone.style.minWidth = cardWidth + 'px';
            clone.style.maxWidth = cardWidth + 'px';
            clone.style.flexShrink = '0';
            grid.appendChild(clone);
        });

        grid.style.width = 'max-content';

        // Total width of original cards (the point at which we seamlessly reset)
        const originalWidth = cards.length * (cardWidth + gap);
        container.scrollLeft = 0;

        // Re-enable observer after our changes settle
        requestAnimationFrame(() => { observerPaused = false; });

        const speed = 1;
        sensorScrollInterval = setInterval(() => {
            container.scrollLeft += speed;
            if (container.scrollLeft >= originalWidth) {
                container.scrollLeft -= originalWidth;
            }
        }, 40);
    }

    // Observer only fires when we aren't the ones changing the DOM
    const sensorObserver = new MutationObserver(() => {
        if (observerPaused) return;
        if (sensorScrollSetupPending) clearTimeout(sensorScrollSetupPending);
        sensorScrollSetupPending = setTimeout(setupSensorScroll, 1000);
    });
    window.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('sensor-grid');
        if (grid) sensorObserver.observe(grid, { childList: true, subtree: true });
    });
    </script>
</body>
</html>
