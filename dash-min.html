<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wendy's Crew Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== HALF-SCREEN OPTIMIZATIONS ===== */

        body {
            gap: 8px;
            padding: 10px;
            /* Give sensors more room (20%), tighten alert/daypart rows */
            grid-template-rows: 10% 7% 1fr 20%;
        }

        #site-indicator {
            font-size: 1rem;
            padding: 3px 10px;
            top: 10px;
            right: 10px;
        }

        #alert-section   { font-size: 2rem; }
        #daypart-section { font-size: 1.4rem; }

        /* Cards */
        .content-row { gap: 10px; }

        .card { padding: 10px 12px; }

        h2 {
            font-size: 1.3rem;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        li {
            font-size: 1.1rem;
            margin-bottom: 8px;
            padding-bottom: 6px;
            line-height: 1.3;
        }

        .lto-img { width: 60px; height: 60px; }

        .jolt-section      { padding: 8px 12px; }
        .jolt-header-small { font-size: 1rem; margin-bottom: 5px; padding-bottom: 4px; }

        /* Sensor row */
        #sensor-row-container { padding: 4px; }
        #sensor-grid          { gap: 4px; }
        .sensor-card          { padding: 4px 6px; }

        /* Override the always-on media query so fonts stay readable on narrow cards */
        @media (min-width: 100px) {
            .sensor-card h3 {
                /* Allow wrapping up to 2 lines so long names aren't silently cut off */
                white-space: normal;
                overflow: hidden;
                text-overflow: clip;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                line-height: 1.15;
                font-size: clamp(0.8rem, 9cqw, 1.1rem);
            }
            .reading    { font-size: clamp(1.5rem, 18cqw, 2.8rem); }
            .signal-row { font-size: clamp(0.75rem, 8cqw, 1rem); }
        }
    </style>
</head>
<body>

    <div id="site-indicator">Store: Loading...</div>

    <div id="closed-overlay" style="display: none;">
        <div>
            <h1>STORE CLOSED</h1>
            <p id="closed-reason">See you tomorrow!</p>
        </div>
    </div>

    <div id="alert-section">Loading System...</div>

    <div id="daypart-section">Calculating Daypart...</div>

    <div class="content-row">
        <div class="card">
            <h2>📢 Announcements</h2>
            <div class="list-container"><ul id="announcements-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card" style="border-top-color: #e00000;"> 
            <h2>🍔 Upcoming LTOs</h2>
            <div class="list-container"><ul id="lto-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card" style="border-top-color: #e6a800;"> 
            <h2>📅 This Week</h2>
            <div class="list-container"><ul id="events-list"><li>Loading...</li></ul></div>
        </div>
        <div class="card jolt-split-card"> 
            <div class="jolt-section jolt-top">
                <div class="jolt-header-small" style="color: #ff9999;">📋 Current & Late</div>
                <div class="list-container" id="jolt-scroll-current"><ul id="jolt-list-current"><li>Syncing...</li></ul></div>
            </div>
            <div class="jolt-section jolt-bottom">
                <div class="jolt-header-small" style="color: #88ccff;">🕒 Upcoming (3 Hrs)</div>
                <div class="list-container" id="jolt-scroll-upcoming"><ul id="jolt-list-upcoming"><li>Loading...</li></ul></div>
            </div>
        </div>
    </div>

    <div id="sensor-row-container">
        <div id="sensor-grid">
            </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
