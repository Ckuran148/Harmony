services:
  thermoworks-push:
    build: .
    restart: unless-stopped
    environment:
      - TW_EMAIL=${TW_EMAIL}
      - TW_PASSWORD=${TW_PASSWORD}
      - PUSH_INTERVAL_MS=${PUSH_INTERVAL_MS:-300000}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/serviceAccount.json
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./serviceAccount.json:/run/secrets/serviceAccount.json:ro
